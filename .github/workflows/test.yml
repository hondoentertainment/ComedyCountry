name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: punchline_atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/punchline_atlas_test
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-production
      GITHUB_ID: ci-placeholder
      GITHUB_SECRET: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/punchline_atlas_test

      - run: npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/punchline_atlas_test

      - run: npx playwright install --with-deps chromium
        env:
          CI: "true"

      - run: npm run test:e2e -- --project=chromium
        env:
          CI: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/punchline_atlas_test
